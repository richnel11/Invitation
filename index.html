<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="invitation">
        <section class="card" aria-label="Carte d'invitation anniversaire">
            <div class="photo-wrap">
                <img src="maphoto.png" alt="Photo de Richnel KANLISSOU">
            </div>

            <div class="content">
                <div class="age-badge" aria-label="18 ans">
                    <span>&infin;</span>
                </div>

                <p class="eyebrow">À l'occasion de son</p>
                <h1>Anniversaire</h1>
                <p class="name">Richnel KANLISSOU</p>

                <div class="divider" aria-hidden="true"></div>

                <p>Vous invite le</p>
                <h2>05 Juillet 2024 à 15h</h2>
                <p class="highlight">Pour une soirée dansante</p>
                <p>Dans la cité de Yayi BONI</p>

                <a class="location" href="https://maps.app.goo.gl/3CJPR2eTY3wQesUZ7">
                    Voir la localisation exacte
                </a>
            </div>
        </section>
    </main>
    <script src="java.js"></script>
</body>
</html>
